services:
  - type: web
    name: person-service
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: person-db
          property: connectionString
    healthCheckPath: /docs

databases:
  - name: person-db
    plan: free
    databaseName: persons
    user: program
