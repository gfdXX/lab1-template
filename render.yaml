services:
  - type: web
    name: person-service
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: person-db
          property: connectionString

databases:
  - name: person-db
    plan: free
    databaseName: persons
    user: program
