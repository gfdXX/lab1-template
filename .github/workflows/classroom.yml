name: GitHub Classroom Workflow
on:
  push:
    branches:
      - debug-unit-tests
  pull_request:
    branches:
      - debug-unit-tests

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Build dockerfile for app
        run: |
          docker build -t person:latest ./ --target=release
          docker save person:latest > person.tar
      - uses: actions/upload-artifact@v4 
        with: 
          name: person-artefact 
          path: person.tar
      
      - name: Build dockerfile for tests
        run: |
          docker build -t person-tests:latest ./ --target=builder
          docker save person-tests:latest > person-tests.tar
      - uses: actions/upload-artifact@v4 
        with: 
          name: person-tests-artefact 
          path: person-tests.tar

  test:
    name: Test Project
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - uses: actions/download-artifact@v4
        with: 
          name: person-tests-artefact 

      - name: Run Unit Tests
        run: |
          docker load < person-tests.tar
          docker compose -f ./docker-compose.tests.yml --project-directory ./ up --exit-code-from person_service_tests
          if [[ 0 == $? ]]
          then
            echo "TESTS_STATUS=success" >> $GITHUB_ENV
          else
            echo "TESTS_STATUS=failed" >> $GITHUB_ENV
          fi

